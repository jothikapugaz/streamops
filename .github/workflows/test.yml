name: StreamOps tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streamops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/streamops_test
      STREAMOPS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/streamops_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run unit tests
        run: npm test
      - name: Run API/database integration tests
        run: npm run test:integration
